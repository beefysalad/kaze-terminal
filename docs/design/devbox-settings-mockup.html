<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaze Devbox Settings</title>
<style>
@font-face{font-family:JB;src:url(../site-assets/JetBrainsMono-Regular.ttf) format('truetype')}
:root{
  color-scheme:dark;
  /* Midnight, the same values as settings-redesign-mockup.html */
  --chrome:#0b0d12;--page:#0f1117;--card:#13161e;--raised:#171b25;--lane:#0c0e14;
  --line:#1d2230;--line2:#262c3b;--fg:#e8eaf1;--fg2:#c9cdd8;--muted:#8a90a2;
  --accent:#8b7bff;--accent2:#b9a6ff;--needs:#f2b84b;--done:#62d39a;--err:#ff6b6b;
}
*{box-sizing:border-box}
body{margin:0;background:#05060a;color:var(--fg);font:13px/1.5 JB,monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.stage{max-width:1120px;margin:0 auto;padding:24px 16px 40px}
.intro{margin:0 0 14px;color:#aab0bf;font-size:12.5px;max-width:860px}
.intro b{color:var(--fg);font-weight:400}
.states{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.states button{font-size:12px;color:var(--fg2);background:var(--page);border:1px solid var(--line);border-radius:7px;padding:7px 12px}
.states button[aria-pressed=true]{color:var(--accent2);background:#1b1930;border-color:#302a50}

.win{border:1px solid #232838;border-radius:12px;overflow:hidden;background:var(--chrome);display:grid;grid-template-columns:220px minmax(0,1fr);height:860px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.nav{background:#0d1016;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.nav h1{font-size:17px;font-weight:400;margin:2px 10px 16px}
.nav .group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
.nav .item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:#b8bdca;font-size:12.5px}
.nav .item svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .item.on{background:rgba(139,123,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,123,255,.30)}
.nav .item.on svg{color:var(--accent2)}

.page{background:var(--page);overflow:auto;min-width:0}
.inner{max-width:780px;margin:0 auto;padding:30px 32px 44px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.head h2{font-size:22px;font-weight:400;margin:0}
.head p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.tools{display:flex;align-items:center;gap:12px;flex:none}
.checked{color:var(--muted);font-size:11.5px;white-space:nowrap}
.btn{border:1px solid var(--line2);background:var(--raised);border-radius:7px;padding:6px 12px;font-size:12px;color:var(--fg2);white-space:nowrap}

/* the summary strip */
.you{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line2);border-radius:14px;background:linear-gradient(115deg,rgba(139,123,255,.18),rgba(139,123,255,.03) 55%),var(--card)}
.you .mascot{width:46px;height:46px;flex:none}
.you .who{min-width:0;flex:1}
.you .who b{font-weight:400;font-size:15px;display:block}
.you .who span{color:var(--muted);font-size:12px}
.tally{display:flex;gap:22px;flex:none}
.tally div{text-align:right}
.tally b{display:block;font-weight:400;font-size:20px;line-height:1.2}
.tally span{color:var(--muted);font-size:11px}
.tally .a b{color:var(--accent2)}.tally .n b{color:var(--needs)}.tally .e b{color:var(--err)}

.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}

/* a job with its lane */
.job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px}
.job + .job{margin-top:10px}
.job.needs{border-color:rgba(242,184,75,.38);background:linear-gradient(115deg,rgba(242,184,75,.09),transparent 50%),var(--card)}
.jobhead{display:flex;align-items:center;gap:12px}
.name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.age{color:var(--muted);font-size:11.5px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:11px;font-size:11.5px;white-space:nowrap;flex:none}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.run{color:var(--accent2);background:rgba(139,123,255,.14)}
.warn{color:var(--needs);background:rgba(242,184,75,.12)}
.ok{color:var(--done);background:rgba(98,211,154,.12)}
.err{color:var(--err);background:rgba(255,107,107,.12)}
.mute{color:var(--muted);background:rgba(138,144,162,.12)}
.ask{color:var(--needs);font-size:11.5px;margin-top:5px}
.lane{position:relative;height:50px;margin-top:10px;border-radius:9px;background:var(--lane);border:1px solid var(--line);overflow:hidden}
.track{position:absolute;inset:0 30px}
.dot{position:absolute;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#8a90a2}
.dot.gone{opacity:.16}
.trail{position:absolute;top:50%;left:-30px;height:2px;margin-top:-1px;border-radius:1px}
.spirit{position:absolute;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px}
.spirit svg{display:block;width:100%;height:100%;overflow:visible}
.moving svg{animation:drift 1.5s ease-in-out infinite}
.moving .gust{animation:gust 1.5s ease-in-out infinite}
.resting svg{animation:breathe 3.2s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
@keyframes gust{0%,100%{opacity:.25;transform:translateX(2px)}50%{opacity:.9;transform:translateX(-2px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* finished jobs: one line, no lane */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;min-height:46px}
.row + .row{border-top:1px solid var(--line)}
.row .mini{width:24px;height:24px;flex:none}
.more{display:block;width:100%;text-align:left;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

.hero{display:flex;gap:14px;align-items:center;padding:18px}
.hero .mascot{width:40px;height:40px;flex:none}
.hero b{font-weight:400;display:block}
.hero span{color:var(--muted);font-size:12px}
.hero .btn{margin-left:auto}
.skeleton{height:10px;border-radius:5px;background:var(--raised);width:42%}

@media (prefers-reduced-motion:reduce){.moving svg,.moving .gust,.resting svg{animation:none}}
@media (max-width:760px){
  .win{grid-template-columns:minmax(0,1fr);height:auto}
  .nav{display:none}
  .inner{padding:20px 16px 28px}
  .head{flex-direction:column;align-items:flex-start}
  .you{flex-wrap:wrap}
  .tally{width:100%;justify-content:space-between}
  .tally div{text-align:left}
  .age{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <p class="intro"><b>Devbox page, with lanes.</b> A wind spirit travels each lane as the job progresses. It moves only while this page is open, and its face and color give the status at a glance. These jobs are made-up samples.</p>
  <div class="states" id="states"></div>

  <div class="win">
    <nav class="nav" aria-label="Settings">
      <h1>Settings</h1>
      <div class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>Appearance</div>
      <div class="item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6"/><rect x="3" y="14" width="18" height="6"/></svg>Workspaces</div>
      <div class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M10.5 8.6 7.5 15.4M13.5 8.6l3 6.8"/></svg>Agents</div>
      <div class="item on"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg>Devbox</div>
      <div class="group">Kaze</div>
      <div class="item"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 4v5h-5"/></svg>Updates</div>
      <div class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.8"/></svg>About</div>
    </nav>
    <main class="page"><div class="inner" id="content"></div></main>
  </div>
</div>

<script>
var needs = [{n:"lap-1446",a:"138h",s:"needs",p:100,q:"OK to push? item 12 Ready on branch sample-feature"}];
var running = [
  {n:"lap-0841",a:"4h",s:"running",p:83},
  {n:"lap-1135-b",a:"89m",s:"running",p:60},
  {n:"lap-1140-b",a:"84m",s:"running",p:50}
];
var finished = [
  {n:"lap-1136-b",a:"88m",s:"failed"},
  {n:"lap-1606",a:"24h",s:"stopped"},
  {n:"lap-0700",a:"78h",s:"done"},
  {n:"lap-1606",a:"92h",s:"stopped"},
  {n:"lap-0830",a:"100h",s:"done"}
];
var pills = {needs:["warn","Needs you"],running:["run","Running"],done:["ok","Done"],failed:["err","Failed"],stopped:["mute","Stopped"]};
var tints = {needs:"#f2b84b",running:"#8b7bff",done:"#62d39a",failed:"#ff6b6b",stopped:"#8a90a2"};

function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* An original character: a curl of wind with a face. */
function spirit(status){
  var c = tints[status], ink = "#0c0e14", face;
  var line = 'fill="none" stroke="'+ink+'" stroke-width="1.9" stroke-linecap="round"';
  if(status==="stopped") face = '<path d="M16.5 15h3.6M22.8 15h3.6" '+line+'/>';
  else if(status==="failed") face = '<path d="M16.8 13l3 3.4M19.8 13l-3 3.4M23 13l3 3.4M26 13l-3 3.4" '+line+'/>';
  else if(status==="done") face = '<path d="M16.5 15.6q1.8-2.8 3.6 0M22.8 15.6q1.8-2.8 3.6 0" '+line+'/>';
  else face = '<ellipse cx="18.4" cy="14.6" rx="1.7" ry="2.3" fill="'+ink+'"/><ellipse cx="24.6" cy="14.6" rx="1.7" ry="2.3" fill="'+ink+'"/>';
  var gust = status==="running" ? '<path class="gust" d="M-7 11h6M-10 16h7M-7 21h5" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"/>' : '';
  var flag = status==="needs" ? '<circle cx="28" cy="4.5" r="5" fill="#f2b84b" stroke="#0c0e14" stroke-width="1.4"/><path d="M28 2v3M28 7v.2" fill="none" stroke="#0c0e14" stroke-width="1.5" stroke-linecap="round"/>' : '';
  return '<svg viewBox="0 0 32 32" aria-hidden="true">'+gust+
    '<path fill="'+c+'" d="M21 4.5C27 4.5 31 9.4 31 15.5 31 22.5 25.8 27 19 27 13 27 8.5 24.4 3.4 26.4 1.6 27 .6 25.4 1.8 24.1 4.2 21.7 5.5 19.7 5.6 17.4 3.8 17.3 2 16.3.9 14.6.2 13.4 1.3 12.2 2.6 12.8 4.2 13.5 5.7 13.4 6.7 12.7 8 7.8 13.9 4.5 21 4.5Z"/>'+
    face+flag+'</svg>';
}
function lane(j){
  var n = 26, dots = "";
  for(var i=0;i<n;i++){
    var at = i/(n-1)*100;
    dots += '<i class="dot'+(at<=j.p?' gone':'')+'" style="left:'+at+'%"></i>';
  }
  var c = tints[j.s];
  var trail = '<div class="trail" style="width:calc('+j.p+'% + 30px);background:linear-gradient(90deg,transparent,'+c+')"></div>';
  var motion = j.s==="running" ? "moving" : "resting";
  return '<div class="lane"><div class="track">'+dots+trail+'<div class="spirit '+motion+'" style="left:'+j.p+'%">'+spirit(j.s)+'</div></div></div>';
}
function pill(s){var p=pills[s];return '<span class="pill '+p[0]+'"><i></i>'+p[1]+'</span>'}
function job(j){
  return '<div class="job'+(j.s==="needs"?" needs":"")+'"><div class="jobhead"><div class="name">'+esc(j.n)+'</div><div class="age">'+j.a+'</div>'+pill(j.s)+'</div>'+
    (j.q?'<div class="ask">'+esc(j.q)+'</div>':'')+lane(j)+'</div>';
}
function row(j){
  return '<div class="row"><div class="mini">'+spirit(j.s)+'</div><div class="name">'+esc(j.n)+'</div><div class="age">'+j.a+'</div>'+pill(j.s)+'</div>';
}
function head(checked,busy){
  return '<div class="head"><div><h2>Devbox</h2><p>Your laps and jobs, and whether they finished.</p></div>'+
    '<div class="tools"><span class="checked">'+checked+'</span><button class="btn"'+(busy?' disabled':'')+'>'+(busy?'Checking':'Refresh')+'</button></div></div>';
}
function you(sub,r,n,f,status){
  return '<div class="you"><div class="mascot">'+spirit(status)+'</div><div class="who"><b>alex</b><span>'+sub+'</span></div>'+
    '<div class="tally"><div class="a"><b>'+r+'</b><span>running</span></div><div class="n"><b>'+n+'</b><span>need you</span></div><div class="e"><b>'+f+'</b><span>failed</span></div></div></div>';
}
function hero(status,title,sub,button){
  return '<div class="label">Status</div><div class="card"><div class="hero"><div class="mascot">'+spirit(status)+'</div><div><b>'+title+'</b><span>'+sub+'</span></div>'+(button?'<button class="btn">'+button+'</button>':'')+'</div></div>';
}
function finishedCard(list,extra){
  return '<div class="label">Recently finished</div><div class="card">'+list.map(row).join("")+(extra||"")+'</div>';
}
var views = {
  "Jobs loaded": function(){
    return head("Checked just now")+you("Your devbox space",3,1,1,"running")+
      '<div class="label">Needs you</div>'+needs.map(job).join("")+
      '<div class="label">Running</div>'+running.map(job).join("")+
      finishedCard(finished,'<button class="more">Show 41 older jobs</button>');
  },
  "Checking": function(){
    var ph = '<div class="job"><div class="skeleton"></div><div class="lane"></div></div>';
    return head("Asking the devbox",true)+'<div class="label">Running</div>'+ph+ph+ph;
  },
  "Can't reach it": function(){
    return head("Last checked 12 minutes ago")+hero("stopped","Couldn't reach the devbox","No connection right now. Statuses are hidden because they may be out of date.","Try again");
  },
  "Nothing running": function(){
    return head("Checked just now")+hero("done","Nothing is running","All your jobs have finished.","")+finishedCard(finished.slice(2,5));
  }
};
var bar = document.getElementById("states"), content = document.getElementById("content");
Object.keys(views).forEach(function(k,i){
  var b = document.createElement("button");
  b.textContent = k;
  b.setAttribute("aria-pressed", i===0);
  b.onclick = function(){
    [].forEach.call(bar.children,function(x){x.setAttribute("aria-pressed",x===b)});
    content.innerHTML = views[k]();
  };
  bar.appendChild(b);
});
content.innerHTML = views["Jobs loaded"]();
</script>
</body>
</html>
